name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      # MySQL 8.0 -- same version as staging/production (see docs/STAGING_DEPLOYMENT.md).
      # Throwaway per-run container; schema is shaped fresh every run via
      # `drizzle-kit push` below, not via the (stale, see WORK_STATUS.md)
      # drizzle-kit migration history.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: paeds_resus_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Job-wide (not step-scoped) so check:db-test-coverage's own env read
      # correctly reports "ran for real" once the integration-test step below
      # has actually run against this. test:unit is unaffected -- its config
      # doesn't include these files regardless of DATABASE_URL (see
      # vitest.unit.config.ts's include list vs. test:db:integration's).
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/paeds_resus_ci
    steps:
      - uses: actions/checkout@v4

      - name: Verify CI workflow matches packageManager
        run: node scripts/verify-ci-workflow.mjs

      # Use packageManager from package.json (pnpm@10.x) — do not pin `version:` here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Shape CI database schema (drizzle-kit push, not migrate -- see WORK_STATUS.md for why)
        run: npx drizzle-kit push --force

      - name: Typecheck, clinical lint (app + service worker)
        run: pnpm run check

      - name: Unit + clinical engine tests
        run: pnpm run test:unit && pnpm run test:clinical

      - name: DB-dependent integration tests (real MySQL)
        run: pnpm run test:db:integration

      - name: Report DB-dependent suites not exercised this run
        run: pnpm run check:db-test-coverage

      - name: Sprint 1 rollup verify
        run: pnpm run verify:sprint1

      - name: Production build
        run: pnpm run build

  # Optional: set repository variable E2E_HOLISTIC_ENABLED=true and secrets
  # E2E_PROVIDER_EMAIL / E2E_PROVIDER_PASSWORD (secrets cannot be used in job `if`).
  e2e-holistic:
    if: vars.E2E_HOLISTIC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - name: Holistic loop E2E
        env:
          E2E_PROVIDER_EMAIL: ${{ secrets.E2E_PROVIDER_EMAIL }}
          E2E_PROVIDER_PASSWORD: ${{ secrets.E2E_PROVIDER_PASSWORD }}
        run: pnpm run test:e2e:holistic
